# Comprueba que el servicio de traducción de Google (Cloud Translation) está activado en cj-club.
# Solo se ejecuta a mano (botón "Run workflow"). Traduce una palabra: coste prácticamente cero.
name: Comprobar la traducción

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Entrar en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: cj-club

      - name: Preparar gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Traducir "Hola" al inglés
        run: |
          TOKEN=$(gcloud auth print-access-token)
          RES=$(curl -sS -X POST https://translation.googleapis.com/language/translate/v2 \
            -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: cj-club" -H "Content-Type: application/json" \
            -d '{"q":["Hola"],"target":"en","format":"text"}')
          echo "$RES" | jq -c '{translations: .data.translations, error: (.error | if . then {status, message: .message[0:200], reason: [.details[]?.reason]} else null end)}'
          if echo "$RES" | grep -q SERVICE_DISABLED; then echo "::error::La traducción NO está activada en el proyecto cj-club."; exit 1; fi
          if echo "$RES" | grep -q translatedText; then echo "La traducción está activada y funciona."; else echo "La traducción está activada (la cuenta de publicación no tiene permiso para traducir, lo cual es normal: traduce la cuenta del servidor)."; fi

      - name: Comprobar la IA de Claude (traducción de Mi reforma)
        run: |
          KEY=$(gcloud secrets versions access latest --secret=ANTHROPIC_API_KEY --project=cj-club 2>/dev/null || true)
          if [ -z "$KEY" ]; then echo "La IA de Claude aún no está configurada (falta el secreto ANTHROPIC_API_KEY). Mientras tanto traduce Google."; exit 0; fi
          echo "::add-mask::$KEY"
          # La misma petición que hace la app (functions/src/projectTranslate.ts)
          BODY='{"model":"claude-opus-5-5","max_tokens":4000,"fallbacks":"default","output_config":{"effort":"low","format":{"type":"json_schema","schema":{"type":"object","properties":{"translations":{"type":"array","items":{"type":"string"}}},"required":["translations"],"additionalProperties":false}}},"system":"You translate texts from a home-renovation project in Spain for the foreign homeowner. Use correct construction terminology. Return one translation per input, in the same order.","messages":[{"role":"user","content":"Target language: Swedish.\nTranslate each of these 2 texts (JSON array):\n[\"Alicatado de baño con azulejo 30x60, incluye rozas y enlucido.\",\"Solado de cocina con gres porcelánico\"]"}]}'
          RES=$(curl -sS https://api.anthropic.com/v1/messages \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "anthropic-beta: server-side-fallback-2026-07-01" -H "content-type: application/json" \
            -d "$BODY")
          echo "$RES" | jq -c '{model, stop_reason, text: [.content[]? | select(.type=="text") | .text], error: .error}'
          if echo "$RES" | jq -e '.error' >/dev/null; then echo "::error::La petición a Claude no funciona (mire el error de arriba)."; exit 1; fi
          echo "$RES" | jq -r '[.content[] | select(.type=="text") | .text] | join("")' | jq -e '.translations | length == 2' >/dev/null || { echo "::error::La respuesta de Claude no tiene el formato esperado."; exit 1; }
          echo "La IA de Claude funciona."
